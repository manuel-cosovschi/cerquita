name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # PostGIS, not plain Postgres: the map, radius queries and clustering all
      # depend on it, so CI must run against the same extension production uses.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: cerquita
          POSTGRES_PASSWORD: cerquita
          POSTGRES_DB: cerquita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cerquita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cerquita:cerquita@localhost:5432/cerquita_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-value-at-least-32-characters-long
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # No `version:` on purpose. The action refuses to start when a version is
      # given here *and* `packageManager` is set in package.json, which is what
      # pins pnpm for everybody else. This is the single source of that version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build shared packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      # Formatting is checked, not applied: a repo with a `format` script whose
      # output nobody runs drifts until the next person's editor reformats a
      # file and buries their change in whitespace.
      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Proves the schema and the custom SQL migration apply cleanly from
      # scratch — including the CHECK constraints and PostGIS indexes.
      - name: Apply migrations
        run: pnpm --filter @cerquita/api db:migrate:deploy

      - name: Seed
        run: pnpm db:seed

      - name: Build apps
        run: |
          pnpm --filter @cerquita/api build
          pnpm --filter @cerquita/web build
          pnpm --filter @cerquita/admin build

      # Mobile has no build, but it does have a resolver. Metro walks a pnpm
      # workspace differently from tsc — that difference is what broke before,
      # and a typecheck cannot see it. Bundling is the only thing that does.
      - name: Bundle mobile
        run: pnpm --filter @cerquita/mobile bundle
        env:
          # The runner has no Android SDK and does not need one to bundle.
          EXPO_NO_TELEMETRY: '1'

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Runs against the API, web and admin builds produced above, on the
      # database seeded above — the whole stack, no mocks. Playwright starts
      # all three servers itself (see playwright.config.ts).
      - name: End-to-end tests
        run: pnpm e2e
        env:
          # The suite drives real sign-ins, so the API needs the same secret it
          # was started with. Everything else comes from the job env above.
          JWT_SECRET: ci-only-secret-value-at-least-32-characters-long

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/.results/
          retention-days: 7

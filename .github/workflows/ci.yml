name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # PostGIS, not plain Postgres: the map, radius queries and clustering all
      # depend on it, so CI must run against the same extension production uses.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: cerquita
          POSTGRES_PASSWORD: cerquita
          POSTGRES_DB: cerquita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cerquita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cerquita:cerquita@localhost:5432/cerquita_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-value-at-least-32-characters-long
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build shared packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Proves the schema and the custom SQL migration apply cleanly from
      # scratch — including the CHECK constraints and PostGIS indexes.
      - name: Apply migrations
        run: pnpm --filter @cerquita/api db:migrate:deploy

      - name: Seed
        run: pnpm db:seed

      - name: Build apps
        run: |
          pnpm --filter @cerquita/api build
          pnpm --filter @cerquita/web build
